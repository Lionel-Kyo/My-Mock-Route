<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Glow & Shadow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Pin Gradients -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base (Squircle Shape) -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)"/>

  <!-- Subtle Map Grid -->
  <g stroke="#334155" stroke-width="4" opacity="0.4">
    <path d="M 120 300 H 904 M 120 512 H 904 M 120 724 H 904" />
    <path d="M 300 120 V 904 M 512 120 V 904 M 724 120 V 904" />
  </g>

  <!-- Simulated Route Path -->
  <path d="M 240 700 C 340 700, 320 420, 512 420 C 680 420, 700 280, 780 280" 
        fill="none" 
        stroke="url(#routeGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-dasharray="30 20" 
        filter="url(#glow)"/>

  <!-- Waypoint Nodes -->
  <circle cx="240" cy="700" r="28" fill="#22C55E"/>
  <circle cx="240" cy="700" r="14" fill="#FFFFFF"/>
  
  <circle cx="780" cy="280" r="28" fill="#10B981"/>
  <circle cx="780" cy="280" r="14" fill="#FFFFFF"/>

  <!-- Simulated Target Location Pin -->
  <g transform="translate(512, 420)" filter="url(#shadow)">
    <!-- Pin Body -->
    <path d="M 0 -180 C -95 -180, -170 -105, -170 -10 C -170 110, 0 210, 0 210 C 0 210, 170 110, 170 -10 C 170 -105, 95 -180, 0 -180 Z" 
          fill="url(#pinGrad)"/>
    
    <!-- Pin Inner Radar / Pulse Ring -->
    <circle cx="0" cy="-10" r="65" fill="#0F172A"/>
    
    <!-- Navigation Arrow Icon -->
    <path d="M 0 -50 L 35 30 L 0 15 L -35 30 Z" fill="#38BDF8"/>
  </g>

  <!-- Anti-Detection Signal Waves -->
  <path d="M 400 180 A 150 150 0 0 1 624 180" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M 430 130 A 210 210 0 0 1 594 130" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.4" />
</svg>
